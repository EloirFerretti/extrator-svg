<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Multi-Arquivos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { 
            --bg: #f8f9fa; --text: #1f2937; --card-bg: #ffffff;
            --primary: #3b82f6; --border: #e5e7eb; --input-bg: #ffffff;
            --log-bg: #1e1e1e; --log-text: #00ff00;
        }

        body.dark-mode {
            --bg: #121212; --text: #f3f4f6; --card-bg: #1f2937;
            --primary: #60a5fa; --border: #374151; --input-bg: #374151;
            --log-bg: #000000; --log-text: #4ade80;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 1200px; margin: 0 auto; transition: 0.3s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 24px; }
        
        .btn-acao { background: var(--card-bg); color: var(--text); border: 2px solid var(--border); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-acao:hover { border-color: var(--primary); }
        .btn-acao:disabled { opacity: 0.5; cursor: not-allowed; }

        .search-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
        input[type="url"] { flex: 1; min-width: 300px; max-width: 500px; padding: 12px 20px; border: 2px solid var(--border); border-radius: 8px; background: var(--input-bg); color: var(--text); font-size: 16px; outline: none; }
        input[type="url"]:focus { border-color: var(--primary); }
        input[type="url"].input-invalido { border-color: #ef4444; }
        button.btn-search { padding: 12px 24px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button.btn-search:disabled { filter: grayscale(0.5); cursor: not-allowed; }
        button.btn-parar { padding: 12px 24px; background: #ef4444; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button.btn-parar:hover { background: #dc2626; }

        .aviso-url { text-align: center; color: #ef4444; font-size: 13px; margin-top: -0.5rem; margin-bottom: 1rem; min-height: 1.2em; }

        .filters { display: flex; justify-content: center; gap: 20px; margin-bottom: 1rem; flex-wrap: wrap; }
        .filters label { display: flex; align-items: center; gap: 5px; font-weight: bold; cursor: pointer; }
        .filters input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        /* Painel de filtros de EXIBIÇÃO (aparece quando os resultados começam a chegar) */
        .painel-exibicao { display: none; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 1rem; font-size: 14px; }
        .painel-exibicao .titulo { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; font-weight: bold; }
        .painel-exibicao label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .painel-exibicao input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .painel-exibicao .contagem { opacity: 0.6; font-size: 12px; }
        .painel-exibicao .separador { width: 1px; height: 18px; background: var(--border); }
        #grupoDuplicados { display: none; align-items: center; gap: 16px; }

        /* Barra de seleção múltipla */
        .barra-selecao { display: none; justify-content: center; align-items: center; gap: 12px; background: var(--primary); color: #fff; border-radius: 10px; padding: 10px 16px; margin-bottom: 1rem; flex-wrap: wrap; }
        .barra-selecao button { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .barra-selecao button:hover:not(:disabled) { background: rgba(255,255,255,0.3); }
        .barra-selecao button:disabled { opacity: 0.6; cursor: not-allowed; }
        .barra-selecao span { font-size: 14px; font-weight: bold; }
        .barra-selecao .status-zip { font-weight: normal; opacity: 0.9; }

        .controls-container { text-align: center; margin-bottom: 1rem; }
        .log-box { display: none; background: var(--log-bg); color: var(--log-text); font-family: monospace; font-size: 13px; text-align: left; padding: 15px; border-radius: 8px; max-height: 250px; overflow-y: auto; margin-bottom: 1.5rem; border: 1px solid #333; }
        .log-box.active { display: block; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; word-break: break-all; }
        .log-page { color: #3b82f6; }
        .log-file { color: #facc15; }

        #status { text-align: center; margin-bottom: 1rem; font-weight: 500; font-size: 18px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .card.duplicado { border-style: dashed; opacity: 0.8; }
        .card.selecionado { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
        
        .img-container { position: relative; width: 100%; height: 150px; border-radius: 8px; background-color: #f1f5f9; background-image: linear-gradient(45deg, #e5e5e5 25%, transparent 25%), linear-gradient(-45deg, #e5e5e5 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e5e5 75%), linear-gradient(-45deg, transparent 75%, #e5e5e5 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .badge-duplicado { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; font-weight: bold; padding: 3px 6px; border-radius: 4px; z-index: 2; }
        .checkbox-selecao { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; cursor: pointer; z-index: 2; accent-color: var(--primary); }
        
        .file-icon { font-size: 32px; font-weight: 900; color: white; padding: 20px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 2px; text-align: center; width: 80%; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .bg-pdf { background: #ef4444; } .bg-ai { background: #f97316; } .bg-cdr { background: #16a34a; } .bg-eps { background: #8b5cf6; }
        
        .file-name { font-size: 12px; word-break: break-all; text-align: center; max-height: 3em; overflow: hidden; color: var(--text); opacity: 0.85; width: 100%; }
        .file-size { font-size: 11px; text-align: center; color: var(--text); opacity: 0.55; margin-top: -6px; }
        
        .btn-group { display: flex; gap: 8px; width: 100%; }
        .btn-group a, .btn-group button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; text-decoration: none; color: white; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; transition: background 0.3s; box-sizing: border-box; border: none; cursor: pointer; font-family: inherit; }
        .view-btn { background: #3b82f6; }
        .view-btn:hover { background: #2563eb; }
        .download-btn { background: #10b981; }
        .download-btn:hover { background: #059669; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 2rem; flex-wrap: wrap; }
        .pagination button { background: var(--card-bg); color: var(--text); border: 2px solid var(--border); min-width: 38px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .pagination button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .pagination button.pagina-atual { background: var(--primary); border-color: var(--primary); color: #fff; }
        .pagination .pagina-reticencias { padding: 0 4px; opacity: 0.5; }
        .pagination .pagina-info { font-size: 13px; opacity: 0.7; margin-left: 8px; white-space: nowrap; }

        /* Modal de visualização */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 1000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-conteudo { background: var(--card-bg); border-radius: 12px; width: 100%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-corpo { flex: 1; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(#e5e5e5 0% 25%, #f1f5f9 0% 50%) 50% / 20px 20px; min-height: 300px; overflow: auto; padding: 20px; box-sizing: border-box; }
        .modal-corpo img { max-width: 100%; max-height: 65vh; object-fit: contain; }
        .modal-corpo iframe { width: 100%; height: 65vh; border: none; background: #fff; border-radius: 6px; }
        .modal-sem-preview { text-align: center; padding: 40px 20px; color: var(--text); }
        .modal-sem-preview p { opacity: 0.7; margin-bottom: 16px; }
        .modal-rodape { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 14px; font-size: 13px; border-top: 1px solid var(--border); color: var(--text); flex-wrap: wrap; }
        .modal-rodape .modal-nome { font-weight: bold; word-break: break-all; }
        .modal-rodape .modal-info { opacity: 0.6; white-space: nowrap; }
        .modal-link-nova-aba { color: var(--primary); text-decoration: none; font-weight: bold; white-space: nowrap; }
        .modal-link-nova-aba:hover { text-decoration: underline; }
        .modal-fechar { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 26px; line-height: 1; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; z-index: 1001; }
        .modal-fechar:hover { background: rgba(255,255,255,0.3); }
        .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 30px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; z-index: 1001; }
        .modal-nav:hover { background: rgba(255,255,255,0.3); }
        .modal-nav-esq { left: 16px; }
        .modal-nav-dir { right: 16px; }
        @media (max-width: 640px) {
            .modal-nav { width: 38px; height: 38px; font-size: 22px; }
            .modal-fechar { width: 36px; height: 36px; font-size: 20px; top: 8px; right: 8px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔍 Extrator Multi-Arquivos</h1>
        <button class="btn-acao" onclick="toggleTema()" id="btnTema">🌙 Modo Noturno</button>
    </div>
    
    <div class="search-box">
        <input type="url" id="urlInput" placeholder="https://exemplo.com" required oninput="verificarUrlEmTempoReal()">
        <button class="btn-search" id="searchBtn" onclick="vasculharSite()">Buscar Arquivos</button>
        <button class="btn-parar" id="pararBtn" onclick="pararBusca()" style="display:none">⏹ Parar</button>
    </div>
    <div class="aviso-url" id="avisoUrl"></div>

    <div class="filters">
        <label><input type="checkbox" value="svg" checked> .SVG</label>
        <label><input type="checkbox" value="pdf" checked> .PDF</label>
        <label><input type="checkbox" value="ai" checked> .AI</label>
        <label><input type="checkbox" value="cdr" checked> .CDR</label>
        <label><input type="checkbox" value="eps" checked> .EPS</label>
    </div>

    <div class="controls-container">
        <button class="btn-acao" onclick="toggleLogs()">📋 Mostrar/Ocultar Terminal de Busca</button>
    </div>
    <div id="logBox" class="log-box"></div>

    <div id="status"></div>

    <!-- Filtros de EXIBIÇÃO: só controlam o que já foi encontrado, não a busca em si -->
    <div class="painel-exibicao" id="painelExibicao">
        <span class="titulo">Mostrar:</span>
        <label><input type="checkbox" class="chk-ext" value="svg" checked onchange="alternarExtensaoVisivel(this)"> SVG <span class="contagem" id="cont-svg"></span></label>
        <label><input type="checkbox" class="chk-ext" value="pdf" checked onchange="alternarExtensaoVisivel(this)"> PDF <span class="contagem" id="cont-pdf"></span></label>
        <label><input type="checkbox" class="chk-ext" value="ai" checked onchange="alternarExtensaoVisivel(this)"> AI <span class="contagem" id="cont-ai"></span></label>
        <label><input type="checkbox" class="chk-ext" value="cdr" checked onchange="alternarExtensaoVisivel(this)"> CDR <span class="contagem" id="cont-cdr"></span></label>
        <label><input type="checkbox" class="chk-ext" value="eps" checked onchange="alternarExtensaoVisivel(this)"> EPS <span class="contagem" id="cont-eps"></span></label>
        <span id="grupoDuplicados">
            <span class="separador"></span>
            <label title="Mantém pelo menos 1 arquivo de cada grupo de duplicados — nunca oculta um grupo inteiro. Duplicado = mesmo desenho (tags <path>) ou mesmo nome de arquivo.">
                <input type="checkbox" id="chkOcultarDuplicados" onchange="alternarOcultarDuplicados()">
                Duplicados
            </label>
            <span class="contagem" id="infoDuplicados"></span>
        </span>
    </div>

    <!-- Barra de seleção múltipla -->
    <div class="barra-selecao" id="barraSelecao">
        <span id="contagemSelecao">0 selecionado(s)</span>
        <button onclick="baixarSelecionados()" id="btnBaixarSelecionados">⬇️ Baixar selecionados (.zip)</button>
        <button onclick="limparSelecao()">Limpar seleção</button>
        <span class="status-zip" id="statusSelecao"></span>
    </div>

    <div class="grid" id="results"></div>
    <div class="pagination" id="pagination" style="display:none"></div>

    <!-- Modal de visualização com navegação -->
    <div class="modal-overlay" id="modalOverlay" onclick="fecharModalSeClicouFora(event)">
        <button class="modal-fechar" onclick="fecharModal()" aria-label="Fechar">&times;</button>
        <button class="modal-nav modal-nav-esq" onclick="navegarModal(-1)" aria-label="Arquivo anterior">&lsaquo;</button>
        <div class="modal-conteudo" onclick="event.stopPropagation()">
            <div class="modal-corpo" id="modalCorpo"></div>
            <div class="modal-rodape">
                <span class="modal-nome" id="modalNome"></span>
                <a href="#" target="_blank" class="modal-link-nova-aba" id="modalAbrirNovaAba">Abrir em nova aba ↗</a>
                <span class="modal-info" id="modalContador"></span>
            </div>
        </div>
        <button class="modal-nav modal-nav-dir" onclick="navegarModal(1)" aria-label="Próximo arquivo">&rsaquo;</button>
    </div>

    <script>
        function toggleTema() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('btnTema').innerText = isDark ? '☀️ Modo Claro' : '🌙 Modo Noturno';
            localStorage.setItem('tema', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('tema') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('btnTema').innerText = '☀️ Modo Claro';
        }

        function toggleLogs() {
            document.getElementById('logBox').classList.toggle('active');
        }

        function adicionarLog(mensagem, classe = '') {
            const logBox = document.getElementById('logBox');
            const entry = document.createElement('div');
            entry.className = `log-entry ${classe}`;
            entry.textContent = mensagem;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight; 
        }

        // --- Validação de URL ---
        function validarUrl(valor) {
            try {
                const u = new URL(valor);
                return u.protocol === 'http:' || u.protocol === 'https:';
            } catch (e) {
                return false;
            }
        }

        function verificarUrlEmTempoReal() {
            const input = document.getElementById('urlInput');
            const aviso = document.getElementById('avisoUrl');
            const valor = input.value.trim();
            if (!valor || validarUrl(valor)) {
                input.classList.remove('input-invalido');
                aviso.textContent = '';
            } else {
                input.classList.add('input-invalido');
                aviso.textContent = 'URL inválida — use uma URL completa, começando com http:// ou https://';
            }
        }

        let fileCount = 0;
        let abortadorAtual = null;

        // --- Estado de resultados: itens, paginação, ordem, duplicados,
        // filtros de exibição e seleção múltipla ---
        const ITENS_POR_PAGINA = 20;
        let todosArquivos = [];
        let contagemChaves = new Map();
        let contagemPorExtensao = new Map();
        let paginaAtual = 1;
        let ocultarDuplicados = false;
        let extensoesVisiveis = new Set(['svg', 'pdf', 'ai', 'cdr', 'eps']);
        let proximoIdItem = 1;
        let idsSelecionados = new Set();
        let indiceModalAtual = -1;

        function hashCurtoCliente(str) {
            let h = 0x811c9dc5;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 0x01000193);
            }
            return (h >>> 0).toString(36);
        }

        function calcularChaveDuplicata(item) {
            if (item.assinatura) return 'path:' + item.assinatura;
            if (item.inline) return 'inline:' + hashCurtoCliente(item.src);
            let nome = item.src.split('/').pop().split('?')[0].toLowerCase();
            try { nome = decodeURIComponent(nome); } catch (e) {}
            return 'nome:' + item.extensao + ':' + nome;
        }

        function sanitizarNome(nome, extensao) {
            let limpo = String(nome).replace(/[\\/?%*:|"<>]/g, '-').trim();
            if (!limpo.toLowerCase().endsWith('.' + extensao)) {
                limpo = limpo.replace(/\.+$/, '');
                limpo += '.' + extensao;
            }
            return limpo;
        }

        function calcularNomeExibicao(item) {
            let base = item.nomeArquivo;
            if (!base) {
                if (item.inline) {
                    base = null;
                } else {
                    base = item.src.split('/').pop().split('?')[0];
                    try { base = decodeURIComponent(base); } catch (e) {}
                }
            }
            if (!base || !base.trim()) base = `arquivo_${item._id}`;
            return sanitizarNome(base, item.extensao);
        }

        function formatarTamanho(bytes) {
            if (bytes === null || bytes === undefined || isNaN(bytes)) return null;
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
        }

        function registrarNovoArquivo(item) {
            item._id = proximoIdItem++;
            const chave = calcularChaveDuplicata(item);
            item._chaveDuplicata = chave;
            const vistosAntes = contagemChaves.get(chave) || 0;
            contagemChaves.set(chave, vistosAntes + 1);
            item._duplicado = vistosAntes > 0;
            item.nomeExibicao = calcularNomeExibicao(item);
            item.tamanhoTexto = formatarTamanho(item.tamanhoBytes);
            todosArquivos.push(item);

            contagemPorExtensao.set(item.extensao, (contagemPorExtensao.get(item.extensao) || 0) + 1);

            const visivel = itemEstaVisivelAgora(item);
            if (paginaAtual === 1 && visivel) {
                adicionarCardNoTopo(item);
            }
            atualizarPainelExibicao();
        }

        // Um item recém-chegado só entra "ao vivo" na página 1 se, com o
        // estado atual de filtros, ele apareceria em itensParaExibir(): ou
        // não está ocultando duplicados, ou ele é a primeira ocorrência do
        // seu grupo (o próprio ato de ocultar nunca reclassifica itens já
        // existentes, só decide sobre o item novo).
        function itemEstaVisivelAgora(item) {
            if (!extensoesVisiveis.has(item.extensao)) return false;
            if (ocultarDuplicados && item._duplicado) return false;
            return true;
        }

        // Filtra por extensão e, ao ocultar duplicados, agrupa pela chave de
        // duplicata e mantém exatamente 1 representante de cada grupo (o
        // item original, não-duplicado) — nunca faz um grupo inteiro
        // desaparecer da lista.
        function itensParaExibir() {
            const porExtensao = todosArquivos.filter((it) => extensoesVisiveis.has(it.extensao));
            if (!ocultarDuplicados) return porExtensao;

            const grupos = new Map();
            porExtensao.forEach((it) => {
                if (!grupos.has(it._chaveDuplicata)) grupos.set(it._chaveDuplicata, []);
                grupos.get(it._chaveDuplicata).push(it);
            });

            const resultado = [];
            grupos.forEach((itensDoGrupo) => {
                resultado.push(itensDoGrupo.find((it) => !it._duplicado) || itensDoGrupo[0]);
            });
            resultado.sort((a, b) => a._id - b._id);
            return resultado;
        }

        function itensVisiveisOrdenados() {
            return itensParaExibir().slice().reverse();
        }

        function totalPaginas() {
            return Math.max(1, Math.ceil(itensVisiveisOrdenados().length / ITENS_POR_PAGINA));
        }

        function obterItensDaPagina(pagina) {
            const lista = itensVisiveisOrdenados();
            const inicio = (pagina - 1) * ITENS_POR_PAGINA;
            return lista.slice(inicio, inicio + ITENS_POR_PAGINA);
        }

        function renderizarPagina(pagina) {
            const resultsEl = document.getElementById('results');
            resultsEl.innerHTML = '';
            obterItensDaPagina(pagina).forEach((item) => resultsEl.appendChild(criarCardElemento(item)));
            atualizarControlesPaginacao();
        }

        function adicionarCardNoTopo(item) {
            const resultsEl = document.getElementById('results');
            resultsEl.insertBefore(criarCardElemento(item), resultsEl.firstChild);
            while (resultsEl.children.length > ITENS_POR_PAGINA) {
                resultsEl.removeChild(resultsEl.lastChild);
            }
        }

        function irParaPagina(pagina) {
            const total = totalPaginas();
            paginaAtual = Math.min(Math.max(1, pagina), total);
            renderizarPagina(paginaAtual);
            document.getElementById('pagination').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function alternarOcultarDuplicados() {
            ocultarDuplicados = document.getElementById('chkOcultarDuplicados').checked;
            paginaAtual = 1;
            renderizarPagina(paginaAtual);
        }

        function alternarExtensaoVisivel(checkbox) {
            if (checkbox.checked) extensoesVisiveis.add(checkbox.value);
            else extensoesVisiveis.delete(checkbox.value);
            paginaAtual = 1;
            renderizarPagina(paginaAtual);
        }

        function atualizarPainelExibicao() {
            const painel = document.getElementById('painelExibicao');
            if (todosArquivos.length > 0) painel.style.display = 'flex';

            ['svg', 'pdf', 'ai', 'cdr', 'eps'].forEach((ext) => {
                const el = document.getElementById(`cont-${ext}`);
                const qtd = contagemPorExtensao.get(ext) || 0;
                el.textContent = qtd > 0 ? `(${qtd})` : '';
            });

            const totalDuplicados = todosArquivos.reduce((acc, it) => acc + (it._duplicado ? 1 : 0), 0);
            const grupoDup = document.getElementById('grupoDuplicados');
            const infoDup = document.getElementById('infoDuplicados');
            if (totalDuplicados > 0) {
                grupoDup.style.display = 'flex';
                infoDup.textContent = `(${totalDuplicados} de ${todosArquivos.length})`;
            } else {
                grupoDup.style.display = 'none';
            }
        }

        // Gera a lista de números de página a mostrar, com "..." nas
        // lacunas: sempre inclui a primeira, a última e uma janela ao redor
        // da página atual, pra dar pra ir direto a qualquer página mesmo
        // com centenas delas.
        function gerarNumerosPaginacao(atual, total) {
            const paginas = [];
            const janela = 2;
            const adicionar = (p) => { if (!paginas.includes(p)) paginas.push(p); };

            adicionar(1);
            for (let p = atual - janela; p <= atual + janela; p++) {
                if (p > 1 && p < total) adicionar(p);
            }
            if (total > 1) adicionar(total);

            paginas.sort((a, b) => a - b);

            const resultado = [];
            for (let i = 0; i < paginas.length; i++) {
                if (i > 0 && paginas[i] - paginas[i - 1] > 1) resultado.push('...');
                resultado.push(paginas[i]);
            }
            return resultado;
        }

        function atualizarControlesPaginacao() {
            const pagEl = document.getElementById('pagination');
            const total = totalPaginas();
            const totalVisivel = itensVisiveisOrdenados().length;

            if (totalVisivel <= ITENS_POR_PAGINA) {
                pagEl.style.display = 'none';
                return;
            }

            pagEl.style.display = 'flex';
            const numeros = gerarNumerosPaginacao(paginaAtual, total);
            const botoesNumericos = numeros.map((n) =>
                n === '...'
                    ? `<span class="pagina-reticencias">…</span>`
                    : `<button class="${n === paginaAtual ? 'pagina-atual' : ''}" onclick="irParaPagina(${n})">${n}</button>`
            ).join('');

            pagEl.innerHTML = `
                <button onclick="irParaPagina(${paginaAtual - 1})" ${paginaAtual === 1 ? 'disabled' : ''} title="Anterior">&lsaquo;</button>
                ${botoesNumericos}
                <button onclick="irParaPagina(${paginaAtual + 1})" ${paginaAtual === total ? 'disabled' : ''} title="Próxima">&rsaquo;</button>
                <span class="pagina-info">(${totalVisivel} arquivos)</span>
            `;
        }

        // --- Seleção múltipla + download em .zip ---
        function alternarSelecao(id, marcado) {
            if (marcado) idsSelecionados.add(id);
            else idsSelecionados.delete(id);
            atualizarBarraSelecao();
        }

        function atualizarBarraSelecao() {
            const barra = document.getElementById('barraSelecao');
            const contagem = document.getElementById('contagemSelecao');
            if (idsSelecionados.size > 0) {
                barra.style.display = 'flex';
                contagem.textContent = `${idsSelecionados.size} selecionado(s)`;
            } else {
                barra.style.display = 'none';
                document.getElementById('statusSelecao').textContent = '';
            }
        }

        function limparSelecao() {
            idsSelecionados.clear();
            atualizarBarraSelecao();
            renderizarPagina(paginaAtual);
        }

        async function baixarSelecionados() {
            if (idsSelecionados.size === 0) return;
            if (typeof JSZip === 'undefined') {
                document.getElementById('statusSelecao').textContent = 'Erro: biblioteca de compactação não carregou.';
                return;
            }

            const btn = document.getElementById('btnBaixarSelecionados');
            const statusSelecao = document.getElementById('statusSelecao');
            btn.disabled = true;

            const itensSelecionados = todosArquivos.filter((it) => idsSelecionados.has(it._id));
            const zip = new JSZip();
            const nomesUsados = new Set();
            let concluidos = 0;
            let falhas = 0;

            for (const item of itensSelecionados) {
                statusSelecao.textContent = `Baixando ${concluidos + falhas + 1} de ${itensSelecionados.length}...`;
                let nomeNoZip = item.nomeExibicao;
                if (nomesUsados.has(nomeNoZip)) {
                    nomeNoZip = nomeNoZip.replace(/(\.[^.]+)$/, `_${item._id}$1`);
                }
                nomesUsados.add(nomeNoZip);

                try {
                    if (item.inline) {
                        const base64 = item.src.split(',')[1];
                        zip.file(nomeNoZip, base64, { base64: true });
                    } else {
                        const url = `/api/download?ext=${item.extensao}&url=${encodeURIComponent(item.src)}`;
                        const resp = await fetch(url);
                        if (!resp.ok) throw new Error('falha ao baixar');
                        const blob = await resp.blob();
                        zip.file(nomeNoZip, blob);
                    }
                    concluidos++;
                } catch (e) {
                    falhas++;
                }
            }

            if (concluidos === 0) {
                statusSelecao.textContent = 'Não foi possível baixar nenhum dos arquivos selecionados.';
                btn.disabled = false;
                return;
            }

            statusSelecao.textContent = 'Compactando...';
            try {
                const conteudoZip = await zip.generateAsync({ type: 'blob' });
                const urlObjeto = URL.createObjectURL(conteudoZip);
                const a = document.createElement('a');
                a.href = urlObjeto;
                a.download = `arquivos_selecionados_${Date.now()}.zip`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(urlObjeto);
                statusSelecao.textContent = falhas > 0
                    ? `Pronto! ${concluidos} arquivo(s) no zip, ${falhas} falharam.`
                    : `Pronto! ${concluidos} arquivo(s) compactados.`;
            } catch (e) {
                statusSelecao.textContent = 'Erro ao gerar o arquivo .zip.';
            }
            btn.disabled = false;
        }

        // --- Modal de visualização ---
        function abrirModalPorId(id) {
            const lista = itensVisiveisOrdenados();
            const indice = lista.findIndex((it) => it._id === id);
            if (indice === -1) return;
            abrirModal(indice);
        }

        function abrirModal(indice) {
            indiceModalAtual = indice;
            renderizarModal();
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('modalCorpo').innerHTML = '';
            indiceModalAtual = -1;
        }

        function fecharModalSeClicouFora(event) {
            if (event.target.id === 'modalOverlay') fecharModal();
        }

        function navegarModal(delta) {
            const lista = itensVisiveisOrdenados();
            if (lista.length === 0) return;
            indiceModalAtual = (indiceModalAtual + delta + lista.length) % lista.length;
            renderizarModal();
        }

        function renderizarModal() {
            const lista = itensVisiveisOrdenados();
            const item = lista[indiceModalAtual];
            if (!item) { fecharModal(); return; }

            const corpo = document.getElementById('modalCorpo');
            const viewUrl = `/api/download?ext=${item.extensao}&action=view&url=${encodeURIComponent(item.src)}`;
            // SVG linkado (URL normal) abre direto; SVG embutido (data:
            // URI) precisa passar pelo proxy, porque navegadores bloqueiam
            // navegação direta pra data: URIs clicadas em um link — o
            // proxy decodifica o data: URI e serve como um arquivo HTTP
            // normal, que abre em nova aba sem problema.
            const linkNovaAba = (item.extensao === 'svg' && !item.inline) ? item.src : viewUrl;

            if (item.extensao === 'svg') {
                corpo.innerHTML = `<img src="${item.src}" alt="Pré-visualização">`;
            } else if (item.extensao === 'pdf') {
                corpo.innerHTML = `<iframe src="${viewUrl}" title="Pré-visualização do PDF"></iframe>`;
            } else {
                corpo.innerHTML = `
                    <div class="modal-sem-preview">
                        <p>Não é possível pré-visualizar arquivos .${item.extensao.toUpperCase()} no navegador. Use o link "Abrir em nova aba" abaixo.</p>
                    </div>
                `;
            }

            document.getElementById('modalNome').textContent = item.nomeExibicao;
            document.getElementById('modalAbrirNovaAba').href = linkNovaAba;
            document.getElementById('modalContador').textContent =
                `${indiceModalAtual + 1} / ${lista.length}${item.tamanhoTexto ? ' • ' + item.tamanhoTexto : ''}`;
        }

        document.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('modalOverlay');
            if (overlay.style.display !== 'flex') return;
            if (e.key === 'Escape') fecharModal();
            else if (e.key === 'ArrowLeft') navegarModal(-1);
            else if (e.key === 'ArrowRight') navegarModal(1);
        });

        // --- Busca / streaming ---
        function pararBusca() {
            if (abortadorAtual) abortadorAtual.abort();
            const statusEl = document.getElementById('status');
            voltarBotoesAoNormal();
            statusEl.innerHTML = `<span style="color:#f59e0b">⏹ Busca interrompida pelo usuário. ${todosArquivos.length} arquivo(s) encontrado(s) até agora.</span>`;
            adicionarLog('[Sistema] Busca interrompida pelo usuário.');
        }

        function voltarBotoesAoNormal() {
            const btn = document.getElementById('searchBtn');
            btn.disabled = false;
            btn.textContent = 'Buscar Arquivos';
            document.getElementById('pararBtn').style.display = 'none';
        }

        function vasculharSite() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusEl = document.getElementById('status');
            const resultsEl = document.getElementById('results');
            const logBox = document.getElementById('logBox');

            const checkboxes = document.querySelectorAll('.filters input:checked');
            const tiposSelecionados = Array.from(checkboxes).map((cb) => cb.value).join(',');

            if (!urlInput || !tiposSelecionados) {
                statusEl.innerHTML = '<span style="color:#ef4444">Insira a URL e selecione pelo menos 1 filtro!</span>';
                return;
            }

            if (!validarUrl(urlInput)) {
                verificarUrlEmTempoReal();
                statusEl.innerHTML = '<span style="color:#ef4444">URL inválida. Digite uma URL completa, começando com http:// ou https:// (ex.: https://exemplo.com)</span>';
                return;
            }

            fecharModal();
            resultsEl.innerHTML = '';
            logBox.innerHTML = '';
            fileCount = 0;
            todosArquivos = [];
            contagemChaves = new Map();
            contagemPorExtensao = new Map();
            paginaAtual = 1;
            ocultarDuplicados = false;
            extensoesVisiveis = new Set(['svg', 'pdf', 'ai', 'cdr', 'eps']);
            idsSelecionados = new Set();
            proximoIdItem = 1;

            document.getElementById('chkOcultarDuplicados').checked = false;
            document.querySelectorAll('.chk-ext').forEach((cb) => { cb.checked = true; });
            document.getElementById('painelExibicao').style.display = 'none';
            document.getElementById('grupoDuplicados').style.display = 'none';
            document.getElementById('barraSelecao').style.display = 'none';
            document.getElementById('pagination').style.display = 'none';
            statusEl.innerHTML = 'Iniciando robô...';

            adicionarLog(`[Sistema] Iniciando busca em: ${urlInput}`);
            executarRodada({ url: urlInput, types: tiposSelecionados });
        }

        async function executarRodada(corpo) {
            if (abortadorAtual) abortadorAtual.abort();
            const meuAbortador = new AbortController();
            abortadorAtual = meuAbortador;

            const statusEl = document.getElementById('status');
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = 'Vasculhando...';
            document.getElementById('pararBtn').style.display = 'inline-block';

            let proximoCorpo = null;

            function finalizarComErro(msg) {
                voltarBotoesAoNormal();
                statusEl.innerHTML = `<span style="color:#ef4444">${msg}</span>`;
            }

            function tratarEvento(data) {
                if (data.tipo === 'status') {
                    statusEl.innerHTML = `<span style="color: var(--primary);">${data.mensagem}</span> <br><small>Fila: ${data.fila} links | Arquivos: <b>${fileCount}</b></small>`;
                    adicionarLog(`[Escaneando] ${data.urlScan}`, 'log-page');
                } else if (data.tipo === 'arquivo') {
                    fileCount++;
                    registrarNovoArquivo(data.item);
                    adicionarLog(`[Encontrado .${data.item.extensao.toUpperCase()}] ${data.logSrc}`, 'log-file');
                    atualizarControlesPaginacao();
                } else if (data.tipo === 'continuar') {
                    adicionarLog(`[Sistema] Ainda há páginas na fila — continuando automaticamente (página ${data.totalPaginas})...`);
                    proximoCorpo = { url: corpo.url, types: corpo.types, maxPages: corpo.maxPages, estado: data.estado };
                } else if (data.tipo === 'fim') {
                    voltarBotoesAoNormal();
                    let msg = `<span style="color:#10b981">Busca finalizada! ${data.totalArquivos} arquivos encontrados em ${data.totalPaginas} páginas.</span>`;
                    if (data.limiteAtingido) {
                        msg += `<br><small style="opacity:0.75">⏱️ Limite de segurança de páginas atingido — pode haver mais arquivos no site.</small>`;
                    }
                    statusEl.innerHTML = msg;
                    adicionarLog(`[Sistema] Busca finalizada com sucesso.`);
                } else if (data.tipo === 'erro') {
                    finalizarComErro(data.mensagem);
                    adicionarLog(`[Erro] ${data.mensagem}`);
                }
            }

            let resposta;
            try {
                resposta = await fetch('/api/extrair-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(corpo),
                    signal: meuAbortador.signal,
                });
            } catch (e) {
                if (e.name === 'AbortError') return;
                finalizarComErro('Não foi possível conectar ao servidor.');
                return;
            }

            if (!resposta.ok || !resposta.body) {
                finalizarComErro(`Erro ao iniciar a busca (HTTP ${resposta.status}).`);
                return;
            }

            const reader = resposta.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const bloco = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        const linha = bloco.split('\n').find((l) => l.startsWith('data:'));
                        if (!linha) continue;
                        try {
                            tratarEvento(JSON.parse(linha.slice(5).trim()));
                        } catch (e) { /* ignora linha malformada */ }
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError') finalizarComErro('Conexão interrompida.');
                return;
            }

            if (proximoCorpo && meuAbortador === abortadorAtual) {
                executarRodada(proximoCorpo);
            }
        }

        function criarCardElemento(item) {
            const card = document.createElement('div');
            card.className = 'card' + (item._duplicado ? ' duplicado' : '') + (idsSelecionados.has(item._id) ? ' selecionado' : '');

            const downloadUrl = `/api/download?ext=${item.extensao}&url=${encodeURIComponent(item.src)}`;
            const nomeArquivo = item.nomeExibicao;

            let visualizacaoHTML = '';
            if (item.extensao === 'svg') {
                visualizacaoHTML = `<img src="${item.src}" alt="Vetor" loading="lazy" onerror="this.style.display='none'">`;
            } else {
                visualizacaoHTML = `<div class="file-icon bg-${item.extensao}">${item.extensao}</div>`;
            }

            let botoesHTML = '';
            if (item.extensao === 'svg' || item.extensao === 'pdf') {
                botoesHTML = `
                    <div class="btn-group">
                        <button type="button" class="view-btn" onclick="abrirModalPorId(${item._id})">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:16px" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            Ver
                        </button>
                        <a href="${downloadUrl}" class="download-btn" download="${nomeArquivo}">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:16px" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Salvar
                        </a>
                    </div>
                `;
            } else {
                botoesHTML = `
                    <div class="btn-group">
                        <a href="${downloadUrl}" class="download-btn" download="${nomeArquivo}">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:16px" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Download
                        </a>
                    </div>
                `;
            }

            const badgeDuplicado = item._duplicado ? `<div class="badge-duplicado">🔁 Duplicado</div>` : '';
            const marcado = idsSelecionados.has(item._id) ? 'checked' : '';

            card.innerHTML = `
                <div class="img-container">
                    ${badgeDuplicado}
                    <input type="checkbox" class="checkbox-selecao" ${marcado} title="Selecionar arquivo" onchange="alternarSelecao(${item._id}, this.checked)">
                    ${visualizacaoHTML}
                </div>
                <div class="file-name" title="${nomeArquivo}">${nomeArquivo}</div>
                ${item.tamanhoTexto ? `<div class="file-size">${item.tamanhoTexto}</div>` : ''}
                ${botoesHTML}
            `;
            return card;
        }
    </script>
